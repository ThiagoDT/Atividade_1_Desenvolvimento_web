<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset='utf-8'>
    <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href='/assets/css/style.css'>
    <title>Login</title>
</head>
<body>
    <main class="card">
        <h1 class="title">Login</h1>
        <form class="auth-form" action="#" method="post">
            <label for="email">E-mail</label>
            <input type="email" required id="email">
            <label for="password">Senha</label>
            <input type="password" required id="password">
        </form>
        <div class="actions">
            <button class="btn-link" href="">Entrar</button>
            <a class="btn-link" href="/Cadastro">Ir para Cadastro</a>
            <a class="btn-link btn_secondary" href="/">Voltar</a>
        </div>
    </main>
</body>
</html>
